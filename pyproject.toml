[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanalytix"
version = "0.2.0"
description = "Cleanalytix is a Data Quality Intelligence and Advanced Analytics library for tabular datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Probot-DATA contributors" }
]
keywords = [
    "data quality",
    "data cleaning",
    "data profiling",
    "EDA",
    "machine learning",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "dateparser>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Probot-DATA/Cleanalytix_Repo"
Repository = "https://github.com/Probot-DATA/Cleanalytix_Repo"
Issues = "https://github.com/Probot-DATA/Cleanalytix_Repo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cleanalytix", "cleanalytix.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
